# Training Configuration for ARShoe 16-KP Model

# Model Architecture
model:
  name: "foot_arshoe_16kp"
  input_size: [256, 256]  # Height, Width
  encoder:
    type: "fast_scnn"
    channels: [32, 64, 96, 128]
    output_channels: 128
    output_stride: 4  # Feature map is 1/4 of input (64×64 for 256×256 input)
  
  decoder_heads:
    heatmap:
      enabled: true
      output_size: [64, 64]
      num_channels: 16
      activation: "sigmoid"
    
    paf:
      enabled: true
      output_size: [64, 64]
      num_channels: 30  # 15 limbs × 2 (x, y)
      activation: "none"
    
    class:
      enabled: true
      output_size: [64, 64]
      num_channels: 2  # left_foot, right_foot
      activation: "softmax"
    
    keypoints:
      enabled: true
      num_keypoints: 16
      output_dim: 3  # (x, y, visibility)
    
    rotation:
      enabled: false  # Enable in M2
      output_dim: 6  # 6-D continuous rotation
    
    mask:
      enabled: false  # Enable in M3
      output_size: [160, 160]
      num_channels: 2  # foot/shoe, occluder
      activation: "sigmoid"
    
    sigma:
      enabled: false  # Enable in M4
      output_dim: 16  # Per-keypoint uncertainty
      activation: "softplus"
    
    confidence:
      enabled: false  # Enable in M4 (computed from sigma)
      output_dim: 16
    
    presence:
      enabled: false  # Enable in M4
      output_dim: 1
      activation: "sigmoid"
    
    scale:
      enabled: false  # Enable in M4
      output_dim: 2  # foot_length, foot_width
      activation: "softplus"
    
    scale_sigma:
      enabled: false  # Enable in M4
      output_dim: 2
      activation: "softplus"

# Dataset
dataset:
  root: "dataset/shuffled_v3"
  train_images: "train/images"
  train_labels: "train/labels"
  valid_images: "valid/images"
  valid_labels: "valid/labels"
  test_images: "test/images"
  test_labels: "test/labels"
  
  num_classes: 2  # left_foot=0, right_foot=1
  num_keypoints: 16
  
  # Data loading
  cache_images: false
  num_workers: 4
  pin_memory: true

# Training Hyperparameters - M1
training:
  # Milestones
  milestone: "M1"  # M1, M2, M3, M4
  
  # Optimizer
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  
  # Scheduler
  scheduler: "cosine"
  T_max: 100
  eta_min: 0.00001
  
  # Training loop
  epochs: 100
  batch_size: 16
  gradient_clip: 1.0
  mixed_precision: true  # fp16 training
  
  # Checkpointing
  save_every: 10  # Save checkpoint every N epochs
  save_best: true  # Save best model by validation metric
  resume: null  # Path to checkpoint to resume from

# Data Augmentation
augmentation:
  # Geometric
  scale_range: [0.8, 1.2]
  rotation_range: [-30, 30]  # degrees
  translation_range: 0.1  # fraction of image size
  
  # Photometric
  brightness: 0.3
  contrast: 0.3
  saturation: 0.3
  hue: 0.1
  
  # Special handling
  horizontal_flip: true
  flip_swap_class: true  # CRITICAL: Swap left/right class when flipping
  no_random_class_flip: true  # NEVER randomly flip class without geometric flip

# Loss Weights - M1
loss_weights:
  heatmap: 4.0
  paf: 1.0
  class: 2.0
  rotation: 0.5  # M2+
  mask: 1.0  # M3+
  sigma: 0.1  # M4+
  presence: 0.5  # M4+
  scale: 0.3  # M4+

# Loss Parameters
loss_params:
  heatmap:
    type: "mse"
    sigma: 2.0  # Gaussian sigma for heatmap generation (pixels on 64×64 map)
  
  paf:
    type: "smooth_l1"
    beta: 1.0
    width: 8  # PAF width along limb (pixels on 64×64 map)
  
  class:
    type: "cross_entropy"
    weight: [1.0, 1.0]  # Equal weight for left/right
  
  rotation:
    type: "geodesic"
  
  mask:
    type: "dice_boundary"
    dice_weight: 0.7
    boundary_weight: 0.3
  
  sigma:
    type: "laplacian_nll"
  
  presence:
    type: "bce"
  
  scale:
    type: "smooth_l1"

# Validation
validation:
  metric: "mAP@50"  # Primary metric for model selection
  compute_every: 1  # Compute validation metrics every N epochs
  
  # Metrics to compute
  compute_map: true
  compute_pck: true
  compute_class_accuracy: true
  compute_rotation_error: false  # M2+
  compute_mask_iou: false  # M3+

# Logging
logging:
  log_dir: "outputs/logs"
  tensorboard: true
  log_every: 10  # Log every N iterations
  save_visualizations: true
  num_vis_samples: 5  # Number of samples to visualize per epoch

# Hardware
hardware:
  device: "cuda"  # cuda, cpu
  gpu_ids: [0]
  deterministic: false
  benchmark: true

# Target Metrics - M1
targets:
  m1:
    map_50: 0.70  # Minimum acceptable (target: 0.80)
    class_accuracy: 0.95
  m2:
    map_50: 0.75
    rotation_error_median: 15.0  # degrees
  m3:
    mask_iou_ch0: 0.85  # (target: 0.90)
    boundary_iou: 0.70  # (target: 0.75)
  m4:
    map_50: 0.80
    rotation_error_median: 6.0
    mask_iou_ch0: 0.90
    sigma_spearman: 0.40
    presence_accuracy: 0.95
